plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.0.2'
}


repositories {
    mavenCentral()
}

allure {
    report {
        version.set("2.40.0") // версия Allure Report
    }
    adapter {
        aspectjWeaver.set(true) // обработка аннотации @Step
        frameworks {
            junit5 {
                adapterVersion.set("2.34.0") // версия Allure JUnit5 adapter
            }
        }
    }
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("com.codeborne:selenide:7.14.0")
    testImplementation('com.github.javafaker:javafaker:1.0.2')
    testImplementation 'org.slf4j:slf4j-simple:2.0.7',
            'io.qameta.allure:allure-selenide:2.34.0'


}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


tasks.withType(Test) {
    useJUnitPlatform()

    systemProperties(System.getProperties())
    systemProperty "file.encoding", "UTF-8"

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}